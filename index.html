<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>每日經文刮刮卡</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{background:#07090e;color:white}.luxe-bg{background-color:#07090e;background-image:radial-gradient(circle at 50% 0%, rgba(202,138,4,.22) 0%, transparent 55%)}#scratchCanvas{touch-action:none;cursor:pointer}#confettiCanvas{pointer-events:none;position:fixed;inset:0}.gold-glass{background:rgba(18,22,34,.78);backdrop-filter:blur(16px);border:1px solid rgba(250,204,21,.35)}.gold-gradient-text{background:linear-gradient(135deg,#fff,#fde047,#ca8a04);-webkit-background-clip:text;-webkit-text-fill-color:transparent}</style></head><body class="luxe-bg min-h-screen flex flex-col items-center"><canvas id="confettiCanvas"></canvas><div class="max-w-md w-full p-4"><div class="text-center my-4"><img class="h-12 mx-auto" src="https://static.wixstatic.com/media/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png/v1/crop/x_0,y_0,w_601,h_131/fill/w_568,h_124,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png"><h1 class="text-3xl font-bold gold-gradient-text mt-3">每日經文刮刮卡</h1></div><div class="relative gold-glass rounded-3xl p-5 min-h-[560px]"><div id="content" class="text-center flex flex-col gap-4"><div id="verseRef" class="bg-amber-500/20 rounded-xl p-3">約翰福音 14:27</div><div><div class="text-amber-300">今日主題</div><h2 id="title" class="text-2xl">【主所賜的平安】</h2><p id="quote" class="mt-3 bg-black/30 p-3 rounded-xl">我留下平安給你們；我將我的平安賜給你們。</p></div><div id="songBlock" class="bg-black/30 p-3 rounded-xl"><div>🎵 今日詩歌推薦</div><div id="song">讚美之泉 - 平安</div></div></div><canvas id="scratchCanvas" class="absolute inset-0 w-full h-full"></canvas><div id="prompt" class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 px-3 py-1 rounded-full">刮開領受今天的信息</div></div><button onclick="pickCard()" class="mt-4 w-full bg-amber-500 text-black py-3 rounded-xl font-bold">領受另一段經文</button></div><script>const cards=[{ref:'約翰福音 14:27',title:'【主所賜的平安】',quote:'我留下平安給你們；我將我的平安賜給你們。',song:'讚美之泉 - 平安'},{ref:'以賽亞書 40:31',title:'【重新得力】',quote:'但那等候耶和華的，必重新得力。',song:'主你是我力量'},{ref:'箴言 3:5-6',title:'【全心信靠】',quote:'你要專心仰賴耶和華，不可倚靠自己的聰明。',song:'因著信'}];let current=0,isComplete=false;const canvas=document.getElementById('scratchCanvas');const ctx=canvas.getContext('2d',{willReadFrequently:true});function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;if(!isComplete)draw();}function draw(){ctx.globalCompositeOperation='source-over';const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);g.addColorStop(0,'#ca8a04');g.addColorStop(.5,'#fde047');g.addColorStop(1,'#854d0e');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#451a03';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('刮開領受今天的信息',canvas.width/2,canvas.height/2);}resize();window.onresize=resize;let down=false;function scratch(x,y){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();check();playScratch();}canvas.onpointerdown=e=>{down=true;scratch(e.offsetX,e.offsetY)};canvas.onpointermove=e=>{if(down)scratch(e.offsetX,e.offsetY)};window.onpointerup=()=>down=false;function check(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let t=0;for(let i=3;i<d.length;i+=16){if(d[i]==0)t++;}if(t/(d.length/16)>.15)reveal();}let audioCtx;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}function playScratch(){if(!audioCtx)return;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=180+Math.random()*80;g.gain.value=.01;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.02);}function reveal(){if(isComplete)return;isComplete=true;ctx.clearRect(0,0,canvas.width,canvas.height);document.getElementById('prompt').style.display='none';chime();confetti();}function chime(){if(!audioCtx)return;[523,659,784].forEach((f,i)=>setTimeout(()=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.value=.08;o.start();o.stop(audioCtx.currentTime+.2)},i*100));}function confetti(){const c=document.getElementById('confettiCanvas'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:60},()=>({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*12,vy:(Math.random()-1)*12,a:1}));(function anim(){x.clearRect(0,0,c.width,c.height);let alive=false;p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.3;o.a-=.02;if(o.a>0){alive=true;x.globalAlpha=o.a;x.fillStyle=['#fde047','#fff','#a855f7'][Math.floor(Math.random()*3)];x.fillRect(o.x,o.y,6,6);}});if(alive)requestAnimationFrame(anim);})();}function pickCard(){current=(current+1)%cards.length;let c=cards[current];verseRef.textContent=c.ref;title.textContent=c.title;quote.textContent=c.quote;song.textContent=c.song;isComplete=false;document.getElementById('prompt').style.display='block';draw();}</script></body></html>
