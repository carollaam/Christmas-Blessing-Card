<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Blessing Card</title>




<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family: sans-serif;

background:
linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)),
url('https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=1200');
background-size:cover;


min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:800px;
text-align:center;
}

.logo{
max-width:160px;
width:70%;
margin-bottom:26px;

filter:
drop-shadow(
    0 0 8px rgba(212,175,55,.25)
);

}

.title{
font-size:30px;
font-weight:700;
line-height:1.35;
color:#6f5200;
margin-bottom:5px;
}

.subtitle{
font-size:15px;
line-height:1.6;
color:#8a8a8a;
margin-bottom:30px;
}

.card{
position:relative;
width:100%;
height:460px;
border-radius:30px;
overflow:hidden;
background:
linear-gradient(
    135deg,
    #fffdf7,
    #fff1c7
);

border:
1px solid rgba(212,175,55,.25);
box-shadow:
    0 15px 40px rgba(0,0,0,.10),
    0 0 30px rgba(212,175,55,.15);
animation:
    floatCard 6s ease-in-out infinite,
    glowCard 6s ease-in-out infinite;
}

@keyframes floatCard{

0%{
    transform:translateY(0px);
}

50%{
    transform:translateY(-12px);
}

100%{
    transform:translateY(0px);
}

}

@keyframes glowCard{

0%{

    box-shadow:
        0 15px 40px rgba(0,0,0,.10),
        0 0 20px rgba(212,175,55,.10);

}

50%{

    box-shadow:
        0 35px 70px rgba(0,0,0,.18),
        0 0 60px rgba(212,175,55,.35);

}

100%{

    box-shadow:
        0 15px 40px rgba(0,0,0,.10),
        0 0 20px rgba(212,175,55,.10);

}

}

.verse{
position:absolute;

top:0;
left:0;

width:100%;
height:100%;

padding:40px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

animation:
fadeInVerse 1s ease;

}

.zh{
font-size:24px;
font-weight:600;
line-height:1.9;
color:#433200;
}

.en{
font-size:15px;
line-height:1.8;
color:#75653c;
font-style:italic;
}

.ref{
margin-top:25px;
font-size:14px;
font-weight:bold;
color:#9c7500;
}

#scratchCanvas{
position:absolute;
top:0;
left:0;

width:100%;
height:100%;

z-index:50;
border-radius:30px;
touch-action:none;
}

.footer{
margin-top:25px;
line-height:1.8;
color:#666;
}

.reset{
font-size:12px;
cursor:pointer;
text-decoration:underline;
}

.message{
font-size:12px;
margin-top:6px;
color:#999;
}

.blessing-id{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
font-size:11px;
color:#c5c5c5;
letter-spacing:2px;
z-index:60;
opacity:0;
transition:opacity .8s ease;
}

.snow{

position:fixed;
inset:0;

pointer-events:none;

opacity:.9;

background-image:

radial-gradient(#ffffff 3px, transparent 3px),

radial-gradient(#d4af37 2px, transparent 2px),

radial-gradient(#ffffff 4px, transparent 4px);

background-size:

180px 180px,
250px 250px,
350px 350px;

animation:
snowFall 18s linear infinite;

}

@keyframes snowFall{

from{
background-position:
0 0,
50px 0;
}

to{
background-position:
0 1000px,
50px 1000px;
}

}

@keyframes fadeInVerse{

from{

opacity:0;
transform:
translateY(20px);

}

to{

opacity:1;
transform:
translateY(0);

}

}

@media(max-width:768px){
.card{
    height:520px;
}
}

#particles{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

z-index:999;

}

.particle{

position:absolute;

font-size:18px;

animation:
    burst 1.5s ease-out forwards;

}

@keyframes burst{

0%{

    opacity:1;

    transform:
        translate(0,0)
        scale(1);

}

100%{

    opacity:0;

    transform:
        translate(
            var(--x),
            var(--y)
        )
        scale(0.3);

}

}

.reveal{

animation:
revealBlessing 2s ease-out forwards;

}

@keyframes revealBlessing{

from{
    clip-path:
    circle(
        0% at 50% 50%
    );
}

to{
    clip-path:
    circle(
        150% at 50% 50%
    );
}

}

</style>
</head>

<body>

<div class="container">

<img
class="logo"
src="https://static.wixstatic.com/media/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png/v1/crop/x_0,y_0,w_601,h_131/fill/w_568,h_124,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png">

<div class="title">
✨ 為您準備了 ✨
<br>
一個特別的聖誕祝福
</div>

<div class="subtitle">
A Special Christmas Blessing for You
</div>

<div class="card">

<div
class="verse"
id="verseContainer">

<div class="zh" id="zhVerse">
載入中...
</div>

<div class="en" id="enVerse">
Loading...
</div>

<div class="ref" id="verseRef">
Please wait...
</div>

</div>

<div class="blessing-id" id="blessingId"></div>

<canvas id="scratchCanvas"></canvas>

</div>

<div class="footer">


<div class="message">
Shepherd International Church | 2026
</div>


<span
class="reset"
onclick="resetBlessing()">

重設次序

</span>



</div>

</div>

<script>

const DEMO_MODE = false;

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbym-Tnz-I0fqaQBDwOb7IzVx_0DFmTIbXxid9qGPmqjwFh_LDtBNF2IA4gT2N6wg0CknQ/exec";

const DEMO_VERSE = {

zh:
"你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華你的神必與你同在。",

en:
"Be strong and courageous. Do not be afraid or discouraged, for the Lord your God will be with you wherever you go.",

refZh:
"約書亞記 1:9",

refEn:
"Joshua 1:9"

};

async function loadVerse(){

let stored =
localStorage.getItem(
"blessingVerse"
);

if(stored){

const verse =
JSON.parse(stored);

displayVerse(verse);

return;
}

if(DEMO_MODE){

localStorage.setItem(
"blessingVerse",
JSON.stringify(DEMO_VERSE)
);

displayVerse(DEMO_VERSE);

return;
}

try{

const response =
await fetch(
GOOGLE_SCRIPT_URL
);

const verse =
await response.json();

localStorage.setItem(
"blessingVerse",
JSON.stringify(verse)
);

displayVerse(verse);

}catch(err){

console.error(err);

displayVerse(DEMO_VERSE);

}

}

function displayVerse(data){

document.getElementById(
"zhVerse"
).innerText =
data.zh || data.verseZh;

document.getElementById(
"enVerse"
).innerText =
data.en || data.verseEn;

document.getElementById(
"verseRef"
).innerHTML =
(data.refZh || "") +
"<br>" +
(data.refEn || "");

if(data.id){

document.getElementById("blessingId").innerHTML =
    "Card #" +
    String(data.id).padStart(3,"0");

}
}

function resetBlessing(){

let pass =
prompt("請輸入密碼");

if(pass==="0000"){

localStorage.removeItem(
"blessingVerse"
);

alert("已重設");

location.reload();

}else{

alert("密碼錯誤");

}

}

const canvas =
document.getElementById(
"scratchCanvas"
);

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

const card =
document.querySelector(".card");

canvas.width =
card.clientWidth;

canvas.height =
card.clientHeight;

drawGoldLayer();

}

function drawGoldLayer(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const gradient =
ctx.createLinearGradient(
0,
0,
canvas.width,
canvas.height
);

gradient.addColorStop(
0,
"#fff8c8"
);

gradient.addColorStop(
0.25,
"#f9d95d"
);

gradient.addColorStop(
0.5,
"#d4af37"
);

gradient.addColorStop(
0.75,
"#f5cf5f"
);

gradient.addColorStop(
1,
"#fff8d1"
);

ctx.fillStyle =
gradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"white";

ctx.textAlign =
"center";

ctx.font =
"bold 24px sans-serif";

ctx.fillText(
"用手指抹開金色塗層",
canvas.width/2,
canvas.height/2-15
);

ctx.font =
"14px sans-serif";

ctx.fillText(
"scratch off the gold foil with your finger",
canvas.width/2,
canvas.height/2+20
);

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

let scratching=false;
let revealed = false;

function scratch(x,y){

revealX = x;
revealY = y;

ctx.globalCompositeOperation =
"destination-out";

ctx.beginPath();

ctx.arc(
    x,
    y,
    28,
    0,
    Math.PI*2
);

ctx.fill();

if(!window.sparkleCooldown){

    playMagicSparkle();

    window.sparkleCooldown = true;

    setTimeout(()=>{

        window.sparkleCooldown = false;

    },150);

}

checkReveal();

}


function checkReveal(){

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const pixels =
imageData.data;

let transparent = 0;

for(
let i=3;
i<pixels.length;
i+=4
){

if(
pixels[i]===0
){
transparent++;
}

}

let percent =
transparent /
(canvas.width *
 canvas.height);

 if(percent > 0.08 && !revealed){

revealed = true;

playRevealSound();

createBlessingBurst();

const verse =
  document.querySelector(".verse");

verse.style.setProperty(
  "--rx",
  revealX + "px"
);

verse.style.setProperty(
  "--ry",
  revealY + "px"
);

verse.classList.add("reveal");

canvas.style.transition =
"opacity 2.8s ease";

canvas.style.opacity = "0";

canvas.style.pointerEvents =
  "none";

document.getElementById(
   "blessingId"
).style.opacity = "1";

}

}

canvas.addEventListener(
"mousedown",
()=>scratching=true
);

canvas.addEventListener(
"mouseup",
()=>scratching=false
);

canvas.addEventListener(
"mousemove",
(e)=>{

if(!scratching) return;

const r =
canvas.getBoundingClientRect();

scratch(
e.clientX-r.left,
e.clientY-r.top
);

}
);

canvas.addEventListener(
"touchstart",
()=>{
scratching=true;
}
);

canvas.addEventListener(
"touchend",
()=>{
scratching=false;
}
);

canvas.addEventListener(
"touchmove",
(e)=>{

const r =
canvas.getBoundingClientRect();

scratch(
e.touches[0].clientX-r.left,
e.touches[0].clientY-r.top
);

}
);

loadVerse();




function playRevealSound(){

const ctx =
    new (window.AudioContext ||
    window.webkitAudioContext)();

const notes = [
    1047,
    1319,
    1568,
    2093
];

notes.forEach((freq,i)=>{

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "sine";

    osc.frequency.value =
        freq;

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    gain.gain.setValueAtTime(
        0.001,
        ctx.currentTime + i*0.08
    );

    gain.gain.exponentialRampToValueAtTime(
        0.05,
        ctx.currentTime + i*0.08 + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + i*0.08 + 0.5
    );

    osc.start(
        ctx.currentTime + i*0.08
    );

    osc.stop(
        ctx.currentTime + i*0.08 + 0.5
    );

});

}


function playMagicSparkle(){

const ctx =
    new (window.AudioContext ||
    window.webkitAudioContext)();

const osc =
    ctx.createOscillator();

const gain =
    ctx.createGain();

osc.type =
    "triangle";

osc.frequency.value =
    2200;

osc.connect(gain);

gain.connect(
    ctx.destination
);

gain.gain.value =
    0.01;

osc.start();

osc.stop(
    ctx.currentTime + 0.02
);

}

function createBlessingBurst(){

const card =
canvas.getBoundingClientRect();

const container =
    document.getElementById(
        "particles"
    );

const icons = [
   "✨",
   "✨",
   "⭐",
   "❅",
   "❄️",
   "✦"
];

for(let i=0;i<12;i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.innerHTML =
        icons[
            Math.floor(
                Math.random() *
                icons.length
            )
        ];

    particle.style.left =
    (card.left + revealX) + "px";

    particle.style.top =
    (card.top + revealY) + "px";

    particle.style.setProperty(
        "--x",
        (Math.random()*300-150)
        + "px"
    );

    particle.style.setProperty(
        "--y",
        (Math.random()*300-150)
        + "px"
    );

    container.appendChild(
        particle
    );

    setTimeout(()=>{

        particle.remove();

    },1500);

}

}

</script>

<div class="snow"></div>
<div id="particles"></div>

</body>
</html>
