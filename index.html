<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Blessing Card</title>




<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Noto Serif TC',serif;

background:
linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)),
url('https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=1200');
background-size:cover;
min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:800px;
text-align:center;
}

.logo{
max-width:280px;
width:100%;
margin-bottom:24px;
}

.title{
font-size:28px;
font-weight:700;
color:#7d5a00;
line-height:1.7;
}

.subtitle{
margin-top:10px;
font-size:16px;
color:#666;
margin-bottom:30px;
}

.card{
position:relative;

width:100%;
height:430px;

border-radius:30px;
overflow:hidden;

background:
linear-gradient(
135deg,
#fffdf7,
#fff6db
);

box-shadow:
0 20px 50px
rgba(0,0,0,.12);
}

.verse{
position:absolute;

top:0;
left:0;

width:100%;
height:100%;

padding:40px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;
}

.zh{
font-size:24px;
font-weight:600;
line-height:1.9;
color:#463600;
}

.en{
margin-top:25px;
font-size:17px;
line-height:1.8;
color:#6d5a1d;
}

.ref{
margin-top:25px;
font-size:18px;
font-weight:bold;
color:#9c7500;
}

#scratchCanvas{
position:absolute;
top:0;
left:0;

width:100%;
height:100%;

z-index:50;
border-radius:30px;
touch-action:none;
}

.footer{

margin-top:25px;
line-height:1.8;
color:#666;
}

.reset{
font-size:12px;
cursor:pointer;
text-decoration:underline;
}

.message{
font-size:12px;
margin-top:6px;
color:#999;
}

</style>
</head>

<body>

<div class="container">

<img
class="logo"
src="https://static.wixstatic.com/media/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png/v1/crop/x_0,y_0,w_601,h_131/fill/w_568,h_124,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/a6bf68_517e552b76364f5a89ba8e87ab4ca217~mv2.png">

<div class="title">
✨ 我們為您準備了一個特別的聖誕祝福 ✨
</div>

<div class="subtitle">
We have a Christmas blessing special for you
</div>

<div class="card">

<div
class="verse"
id="verseContainer">

<div class="zh" id="zhVerse">
載入中...
</div>

<div class="en" id="enVerse">
Loading...
</div>

<div class="ref" id="verseRef">
Please wait...
</div>

</div>

<canvas id="scratchCanvas"></canvas>

</div>

<div class="footer">


<div class="message">
Shepherd International Church | 2026
</div>


<span
class="reset"
onclick="resetBlessing()">

重設次序

</span>



</div>

</div>

<script>

const DEMO_MODE = true;

const GOOGLE_SCRIPT_URL =
"https://YOUR_SCRIPT_URL";

const DEMO_VERSE = {

zh:
"你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華你的神必與你同在。",

en:
"Be strong and courageous. Do not be afraid or discouraged, for the Lord your God will be with you wherever you go.",

refZh:
"約書亞記 1:9",

refEn:
"Joshua 1:9"

};

async function loadVerse(){

let stored =
localStorage.getItem(
"blessingVerse"
);

if(stored){

const verse =
JSON.parse(stored);

displayVerse(verse);

return;
}

if(DEMO_MODE){

localStorage.setItem(
"blessingVerse",
JSON.stringify(DEMO_VERSE)
);

displayVerse(DEMO_VERSE);

return;
}

try{

const response =
await fetch(
GOOGLE_SCRIPT_URL
);

const verse =
await response.json();

localStorage.setItem(
"blessingVerse",
JSON.stringify(verse)
);

displayVerse(verse);

}catch(err){

console.error(err);

displayVerse(DEMO_VERSE);

}

}

function displayVerse(data){

document.getElementById(
"zhVerse"
).innerText =
data.zh || data.verseZh;

document.getElementById(
"enVerse"
).innerText =
data.en || data.verseEn;

document.getElementById(
"verseRef"
).innerHTML =

(data.refZh || "") +
"<br>" +
(data.refEn || "");

}

function resetBlessing(){

let pass =
prompt("請輸入密碼");

if(pass==="0000"){

localStorage.removeItem(
"blessingVerse"
);

alert("已重設");

location.reload();

}else{

alert("密碼錯誤");

}

}

const canvas =
document.getElementById(
"scratchCanvas"
);

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

const card =
document.querySelector(".card");

canvas.width =
card.clientWidth;

canvas.height =
card.clientHeight;

drawGoldLayer();

}

function drawGoldLayer(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const gradient =
ctx.createLinearGradient(
0,
0,
canvas.width,
canvas.height
);

gradient.addColorStop(
0,
"#fff8c8"
);

gradient.addColorStop(
0.25,
"#f9d95d"
);

gradient.addColorStop(
0.5,
"#d4af37"
);

gradient.addColorStop(
0.75,
"#f5cf5f"
);

gradient.addColorStop(
1,
"#fff8d1"
);

ctx.fillStyle =
gradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"white";

ctx.textAlign =
"center";

ctx.font =
"bold 28px serif";

ctx.fillText(
"用手指抹開金色塗層",
canvas.width/2,
canvas.height/2-15
);

ctx.font =
"18px serif";

ctx.fillText(
"Scratch off the gold foil with your finger",
canvas.width/2,
canvas.height/2+20
);

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

let scratching=false;

function scratch(x,y){

ctx.globalCompositeOperation =
"destination-out";

ctx.beginPath();

ctx.arc(
x,
y,
28,
0,
Math.PI*2
);

ctx.fill();

checkReveal();

}

function checkReveal(){

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const pixels =
imageData.data;

let transparent = 0;

for(
let i=3;
i<pixels.length;
i+=4
){

if(
pixels[i]===0
){
transparent++;
}

}

let percent =
transparent /
(canvas.width *
 canvas.height);

if(percent > 0.40){

canvas.style.transition =
"0.8s";

canvas.style.opacity =
"0";

canvas.style.pointerEvents =
"none";

}

}

canvas.addEventListener(
"mousedown",
()=>scratching=true
);

canvas.addEventListener(
"mouseup",
()=>scratching=false
);

canvas.addEventListener(
"mousemove",
(e)=>{

if(!scratching) return;

const r =
canvas.getBoundingClientRect();

scratch(
e.clientX-r.left,
e.clientY-r.top
);

}
);

canvas.addEventListener(
"touchstart",
()=>{
scratching=true;
}
);

canvas.addEventListener(
"touchend",
()=>{
scratching=false;
}
);

canvas.addEventListener(
"touchmove",
(e)=>{

const r =
canvas.getBoundingClientRect();

scratch(
e.touches[0].clientX-r.left,
e.touches[0].clientY-r.top
);

}
);

loadVerse();

</script>

</body>
</html>
